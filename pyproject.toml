[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aadhaar-offline-status-research"
version = "0.2.0"
description = "Synthetic signed QR verification, issuer binding and cached offline status research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["cryptography>=44,<52", "qrcode>=8,<9", "Pillow>=11,<14"]

[project.optional-dependencies]
scanner = ["zxing-cpp>=2.3,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
p1qr = "p1qr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/p1qr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

